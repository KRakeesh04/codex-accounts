name: Cross-platform E2E

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installed-cli:
    name: E2E / ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.14"]
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test tooling
        run: python -m pip install uv ruff

      - name: Check E2E test code
        run: python -m ruff check tests/e2e

      - name: Check E2E formatting
        run: python -m ruff format --check tests/e2e

      - name: Build application and fake backend wheels
        run: python -m pip wheel --no-deps --wheel-dir dist . ./tests/e2e/backend

      - name: Test isolated uv installations
        run: python tests/e2e/run.py --wheel-dir dist --report-dir artifacts/e2e

      - name: Upload E2E diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ matrix.os }}-python-${{ matrix.python-version }}
          path: artifacts/e2e
          if-no-files-found: warn
          retention-days: 7

  required:
    name: E2E required
    needs: installed-cli
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every platform job to pass
        env:
          E2E_RESULT: ${{ needs.installed-cli.result }}
        run: test "$E2E_RESULT" = success
